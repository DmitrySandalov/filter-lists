name: Update Microsoft Attack Simulation Domains

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 06:00 UTC
  workflow_dispatch:     # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest domains from Microsoft Learn
        id: fetch
        run: |
          set -euo pipefail
          
          # Fetch page as markdown and extract domains
          curl -sL "https://learn.microsoft.com/en-us/defender-office-365/attack-simulation-training-get-started?accept=text/markdown" \
            | grep -oE '`https://www\.[a-z0-9.-]+`' \
            | tr -d '`' \
            | sed 's#https://www\.##' \
            | sort -u > current.txt
          
          # Count domains
          count=$(wc -l < current.txt)
          echo "Found $count domains"
          
          if [ "$count" -eq 0 ]; then
            echo "Error: No domains found"
            exit 1
          fi
          
          echo "domains<<EOF" >> $GITHUB_OUTPUT
          cat current.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Generate Adblock Plus format filter list
        id: generate-adblock
        run: |
          set -euo pipefail
          
          mapfile -t domains < <(echo "${{ steps.fetch.outputs.domains }}")
          
          {
            echo "! Title: Microsoft Attack Simulation Training domains"
            echo "! Description: Phishing-simulation URL domains used by Microsoft Defender for Office 365 Attack simulation training. Blocks them in the browser."
            echo "! Version: $(date +%Y.%m.%d)"
            echo "! Last modified: $(date +%Y-%m-%d)"
            echo "! Expires: 7 days"
            echo "! Homepage: https://learn.microsoft.com/en-us/defender-office-365/attack-simulation-training-get-started"
            echo "!"
            echo "! ---- SOURCE ----"
            echo "! Microsoft Learn: \"Get started using Attack simulation training\" (Microsoft Defender for Office 365)"
            echo "! https://learn.microsoft.com/en-us/defender-office-365/attack-simulation-training-get-started"
            echo "! Where: section \"Simulations\", table \"The URLs that are used by Attack simulation training are listed in the following table\""
            echo "! Page last updated by Microsoft: $(date +%Y-%m-%d) | Retrieved: $(date +%Y-%m-%d) | Domains: ${{ steps.fetch.outputs.count }} (all listed as https://www.<domain>)"
            echo "! Docs source file: https://github.com/MicrosoftDocs/defender-docs/blob/public/defender-office-365/attack-simulation-training-get-started.md"
            echo "!"
            echo "! ---- HOW TO UPDATE ----"
            echo "! This file is auto-generated by GitHub Actions. Do not edit manually."
            echo "! Workflow: .github/workflows/update-ms-attack-simulation.yml"
            echo "!"
            echo "! Note: ||domain^ also covers www. and any other subdomain."
            echo "! Note: Blocking these hides clicks from your own simulation reports."
            echo "!"
            for domain in "${domains[@]}"; do
              echo "||${domain}^"
            done
          } > ms-attack-simulation-domains.txt
          
          echo "Generated ms-attack-simulation-domains.txt with ${{ steps.fetch.outputs.count }} domains"

      - name: Generate hosts file format
        id: generate-hosts
        run: |
          set -euo pipefail
          
          mapfile -t domains < <(echo "${{ steps.fetch.outputs.domains }}")
          
          {
            echo "# Microsoft Attack Simulation Training domains - Hosts file format"
            echo "# ----"
            echo "# title:          Microsoft Attack Simulation Training domains (Hosts format)"
            echo "# last updated:   $(date +%Y-%m-%d)"
            echo "# entries:        ${{ steps.fetch.outputs.count }}"
            echo "# format:         hosts (hosts -- in hosts file format)"
            echo "# homepage:       https://github.com/DmitrySandalov/filter-lists"
            echo "# source:         https://learn.microsoft.com/en-us/defender-office-365/attack-simulation-training-get-started"
            echo "# description:    Phishing-simulation URL domains used by Microsoft Defender for Office 365 Attack simulation training."
            echo "# note:           This file is auto-generated by GitHub Actions. Do not edit manually."
            echo "# workflow:       .github/workflows/update-ms-attack-simulation.yml"
            for domain in "${domains[@]}"; do
              echo "127.0.0.1 ${domain}"
            done
          } > ms-attack-simulation-domains-hosts.txt
          
          echo "Generated ms-attack-simulation-domains-hosts.txt with ${{ steps.fetch.outputs.count }} domains"

      - name: Check for changes
        id: changes
        run: |
          changed=false
          if ! git diff --quiet ms-attack-simulation-domains.txt; then
            echo "Adblock format changed"
            changed=true
          fi
          if ! git diff --quiet ms-attack-simulation-domains-hosts.txt; then
            echo "Hosts format changed"
            changed=true
          fi
          
          if [ "$changed" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff ms-attack-simulation-domains.txt ms-attack-simulation-domains-hosts.txt
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ms-attack-simulation-domains.txt ms-attack-simulation-domains-hosts.txt
          git commit -m "chore: update Microsoft Attack Simulation domains ($(date +%Y-%m-%d))"
          git push